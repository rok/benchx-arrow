# Derived from the repository, never a source of truth: ingest every run under
# runs/ into a benchx store, derive the dashboard's tables (tools/marts.py), keep
# the store as a cache and an artifact, and publish site/ to GitHub Pages when the
# repository variable PAGES_ENABLED is "true". Delete the cache and this job
# rebuilds everything from the documents.
name: publish
on:
  push:
    branches: [main]
    paths: ["runs/**", "tools/**", "site/**", ".github/workflows/publish.yml"]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
env:
  BENCHX_REPO: rok/benchx   # must match the benchx the node runs; the schema is shared
  BENCHX_REF: main
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.BENCHX_REPO }}
          ref: ${{ env.BENCHX_REF }}
          path: _benchx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e _benchx/prototype chdb
      - uses: actions/cache/restore@v4
        with:
          path: _home/store.parquet
          key: store-${{ github.sha }}
          restore-keys: store-
      - name: ingest and derive
        env:
          BENCHX_HOME: ${{ github.workspace }}/_home
        run: tools/build-site.sh
      - name: summary
        env:
          BENCHX_HOME: ${{ github.workspace }}/_home
        run: |
          {
            echo "## benchx-arrow store"
            echo
            echo "commits measured: $(ls runs | grep -vc README || true)"
            echo "series: $(bx series | wc -l)"
            echo
            echo '```json'
            cat site/data/manifest.json
            echo '```'
            echo
            echo '```'
            bx head --table --project arrow -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: _home/store.parquet
          key: store-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: store
          path: _home/store.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
        if: vars.PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: site
  deploy:
    needs: publish
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

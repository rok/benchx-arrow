# Derived from the repository, never a source of truth: derive the dashboard's
# tables from the Parquet files under runs/ (tools/marts.py) and publish site/ to
# GitHub Pages when the repository variable PAGES_ENABLED is "true".
name: publish
on:
  push:
    branches: [main]
    paths: ["runs/**", "tools/**", "site/**", "project.json", ".github/workflows/publish.yml"]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: project
        run: echo "name=$(jq -r .name project.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r tools/requirements.txt
      - name: test the derived tables and views
        run: python -m pytest -q tools
      - name: derive
        run: tools/build-site.sh
      - name: summary
        run: |
          {
            echo "## ${{ steps.project.outputs.name }} benchmarks"
            echo
            echo "commits measured: $(ls runs | grep -vc README || true)"
            echo
            echo '```json'
            cat site/data/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
        if: vars.PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: site
  deploy:
    needs: publish
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

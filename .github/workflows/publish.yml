# Derived from the repository, never a source of truth: ingest every run under
# runs/ into a benchx store, derive the dashboard's tables (tools/marts.py), keep
# the store as a cache and an artifact, and publish site/ to GitHub Pages when the
# repository variable PAGES_ENABLED is "true". Delete the cache and this job
# rebuilds everything from the documents.
name: publish
on:
  push:
    branches: [main]
    paths: ["runs/**", "tools/**", "site/**", "project.json", ".github/workflows/publish.yml"]
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: project
        run: echo "name=$(jq -r .name project.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r tools/requirements.txt
      - name: test the derived tables and views
        run: python -m pytest -q tools
      # The store's format belongs to the benchx that wrote it: a new pin starts a new store.
      - uses: actions/cache/restore@v4
        with:
          path: |
            _home/store.parquet
            _home/ingested.txt
          key: store-${{ hashFiles('tools/requirements.txt') }}-${{ github.sha }}
          restore-keys: store-${{ hashFiles('tools/requirements.txt') }}-
      - name: ingest and derive
        env:
          BENCHX_HOME: ${{ github.workspace }}/_home
        run: tools/build-site.sh
      - name: summary
        env:
          BENCHX_HOME: ${{ github.workspace }}/_home
        run: |
          {
            echo "## ${{ steps.project.outputs.name }} benchmarks"
            echo
            echo "commits measured: $(ls runs | grep -vc README || true)"
            echo "series: $(bx series | wc -l)"
            echo
            echo '```json'
            cat site/data/manifest.json
            echo '```'
            echo
            echo '```'
            bx head --table --project "${{ steps.project.outputs.name }}" -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            _home/store.parquet
            _home/ingested.txt
          key: store-${{ hashFiles('tools/requirements.txt') }}-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: store
          path: _home/store.parquet
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
        if: vars.PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: site
  deploy:
    needs: publish
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
